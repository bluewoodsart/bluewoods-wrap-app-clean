name: Apply customer information editing

on:
  push:
    branches:
      - feature/customer-information-editing
    paths:
      - .github/workflows/apply-customer-information-editing.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/customer-information-editing
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch AdminStatus customer section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/pages/AdminStatus.tsx')
          workflow_path = Path('.github/workflows/apply-customer-information-editing.yml')
          text = source_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import WesleyWingsProofGallery from '@/components/WesleyWingsProofGallery';",
              "import WesleyWingsProofGallery from '@/components/WesleyWingsProofGallery';\nimport CustomerInformationEditor from '@/components/admin/CustomerInformationEditor';",
              'customer editor import'
          )

          replace_once(
              '<DialogDescription>Read-only quote request details</DialogDescription>',
              '<DialogDescription>Quote request details</DialogDescription>',
              'dialog description'
          )

          replace_once(
              '                <h3 className="mb-3 text-sm font-semibold text-slate-950">Customer</h3>',
              '''                <CustomerInformationEditor
                  quote={activeQuote}
                  currentAdminRole={currentAdminRole}
                  onSaved={(updatedCustomer) => {
                    setSelectedQuote((currentQuote) =>
                      currentQuote?.id === activeQuote.id
                        ? { ...currentQuote, ...updatedCustomer }
                        : currentQuote
                    );
                    setSelectedQuoteDetail((currentQuote) =>
                      currentQuote?.id === activeQuote.id
                        ? { ...currentQuote, ...updatedCustomer }
                        : currentQuote
                    );
                    setQuotes((currentQuotes) =>
                      currentQuotes.map((quote) =>
                        quote.id === activeQuote.id
                          ? { ...quote, ...updatedCustomer }
                          : quote
                      )
                    );
                    void loadStatusEvents(activeQuote.id);
                  }}
                />''',
              'customer heading'
          )

          source_path.write_text(text, encoding='utf-8')
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit verified feature
        shell: bash
        run: |
          git config user.name "bwb-build-bot"
          git config user.email "153660767+bluewoodsart@users.noreply.github.com"
          git add src/pages/AdminStatus.tsx .github/workflows/apply-customer-information-editing.yml
          if git diff --cached --quiet; then
            echo "No patch changes detected."
            exit 1
          fi
          git commit -m "Connect customer information editor to admin quote details"
          git push origin HEAD:feature/customer-information-editing
