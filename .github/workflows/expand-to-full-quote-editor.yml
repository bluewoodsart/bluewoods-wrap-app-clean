name: Expand CRM edit workflow to full quote records

on:
  push:
    branches:
      - feature/customer-information-editing
    paths:
      - .github/workflows/expand-to-full-quote-editor.yml
      - scripts/expand_quote_editor.py

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/customer-information-editing
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply quote editor patch
        run: python scripts/expand_quote_editor.py

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit verified full quote editor
        run: |
          git config user.name "bwb-build-bot"
          git config user.email "153660767+bluewoodsart@users.noreply.github.com"
          git add -A
          git commit -m "Connect full quote editing to the CRM record"
          git push origin HEAD:feature/customer-information-editing
